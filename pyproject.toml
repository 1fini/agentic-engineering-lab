[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-agent-runtime"
version = "0.1.0.dev0"
description = "Durable control-plane runtime for long-running AI agent missions"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Agentic Engineering Lab contributors" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[project.scripts]
argus = "argus.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
